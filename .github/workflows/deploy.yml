name: CI/CD Pipeline for Easy Com API Deployment

on:
  push:
    branches: [ main, stage ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build Go binary
      run: |
        GOOS=linux GOARCH=amd64 go build -o easy_com_api ./cmd/main.go
      env:
        CGO_ENABLED: 0  # For static binary

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: easy_com_api-binary
        path: easy_com_api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download binary artifact
      uses: actions/download-artifact@v4
      with:
        name: easy_com_api-binary
        path: .

    - name: Install sshpass
      run: sudo apt update && sudo apt install -y sshpass

    - name: Create deployment script
      run: |
        cat > deploy.sh << 'EOF'
        #!/bin/bash
        ENV=$1
        if [ "$ENV" = "production" ]; then
          SERVICE="easy_com_api"
          OPT_DIR="/opt/easy_com_api"
          DB_NAME="easy_com_db"
        else
          SERVICE="easy_com_api_stage"
          OPT_DIR="/opt/easy_com_api_stage"
          DB_NAME="easy_com_stage_db"
        fi

        # Stop the running service
        sudo systemctl stop $SERVICE || true

        # Backup old binary if exists
        [ -f $OPT_DIR/easy_com_api ] && sudo mv $OPT_DIR/easy_com_api $OPT_DIR/easy_com_api.backup

        # Ensure directory exists
        sudo mkdir -p $OPT_DIR

        # Move new binary to path
        sudo mv /tmp/easy_com_api $OPT_DIR/easy_com_api
        sudo chmod +x $OPT_DIR/easy_com_api

        # Optional: Run database migrations (uncomment and adjust if using a migrator)
        # cd $OPT_DIR && $OPT_DIR/easy_com_api migrate -database "postgres://easy_com_user:your_db_password@localhost:5432/$DB_NAME?sslmode=disable" up

        # Start the service
        sudo systemctl start $SERVICE
        sudo systemctl status $SERVICE --no-pager -l

        # Clean up
        rm /tmp/easy_com_api

        # Log deployment
        echo "Deployed to $ENV on $(date)"
        EOF
        chmod +x deploy.sh

    - name: Deploy via SSH only
      env:
        HOST: ${{ (github.ref == 'refs/heads/main' && secrets.PROD_SERVER_HOST) || secrets.STAGE_SERVER_HOST }}
        USERNAME: ${{ (github.ref == 'refs/heads/main' && secrets.PROD_SERVER_USERNAME) || secrets.STAGE_SERVER_USERNAME }}
        PASSWORD: ${{ (github.ref == 'refs/heads/main' && secrets.PROD_SERVER_PASSWORD) || secrets.STAGE_SERVER_PASSWORD }}
        ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      run: |
        # Upload binary via SSH pipe
        sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no "$USERNAME@$HOST" 'cat > /tmp/easy_com_api' < easy_com_api

        # Upload deployment script via SSH pipe
        sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no "$USERNAME@$HOST" 'cat > /tmp/deploy.sh' < deploy.sh

        # Execute deployment script
        sshpass -p "$PASSWORD" ssh -o StrictHostKeyChecking=no "$USERNAME@$HOST" "chmod +x /tmp/deploy.sh && /tmp/deploy.sh $ENV && rm /tmp/deploy.sh"